<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" role="img" aria-labelledby="title desc">
  <title>ContextWorks Digital Systems header logo</title>
  <desc>Compact header logo inspired by the original company logo with separated CW mark and wordmark.</desc>
  <defs>
    <linearGradient id="tealBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19b7b0"/>
      <stop offset="100%" stop-color="#0a66b2"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb000"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f3f66" flood-opacity="0.18"/>
    </filter>
    <style>
      .wordmark { font-family: 'Aptos', 'Segoe UI', Arial, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <rect width="640" height="120" fill="none"/>

  <g transform="translate(12 16)" filter="url(#softShadow)">
    <rect x="0" y="0" width="86" height="86" rx="24" fill="#ffffff" opacity="0.97"/>
    <rect x="6" y="6" width="74" height="74" rx="21" fill="#f8fbfe" stroke="#dbe7f1" stroke-width="1.5"/>
    <text x="15" y="57" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#19b7b0">C</text>
    <text x="31" y="57" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0a66b2">W</text>
    <rect x="14" y="66" width="46" height="4" rx="2" fill="url(#orangeGlow)"/>
  </g>

  <g transform="translate(114 18)">
    <text x="0" y="46" class="wordmark" font-size="46" fill="#0a66b2">Context</text>
    <text x="187" y="46" class="wordmark" font-size="46" fill="#19b7b0">Works</text>
    <rect x="2" y="56" width="300" height="3.5" rx="1.75" fill="#dbe7f1"/>
    <text x="4" y="84" class="wordmark" font-size="17" font-weight="600" letter-spacing="0.22em" fill="#5f6b7a">DIGITAL SYSTEMS PVT LTD</text>
  </g>
</svg>
