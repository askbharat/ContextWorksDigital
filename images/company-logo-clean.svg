<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title>ContextWorks Digital Systems logo</title>
  <desc>Horizontal logo with a teal, blue, and orange monogram and the ContextWorks wordmark.</desc>
  <defs>
    <linearGradient id="tealBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19b7b0"/>
      <stop offset="100%" stop-color="#0a66b2"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb000"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f3f66" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.05  0 1 0 0 0.63  0 0 1 0 0.82  0 0 0 0.55 0" result="glowColor"/>
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .wordmark { font-family: 'Aptos', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .tagline { font-family: 'Aptos', 'Segoe UI', Arial, sans-serif; font-weight: 500; letter-spacing: 0.18em; }
    </style>
  </defs>

  <rect width="920" height="220" fill="none"/>

  <g transform="translate(20 32)" filter="url(#softShadow)">
    <rect x="0" y="0" width="144" height="144" rx="36" fill="#ffffff" opacity="0.0"/>
    <rect x="16" y="16" width="112" height="112" rx="28" fill="#f8fbfe" stroke="#dbe7f1" stroke-width="2"/>
    <text x="39" y="92" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#19b7b0">C</text>
    <text x="77" y="92" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#0a66b2">W</text>
    <rect x="38" y="102" width="70" height="6" rx="3" fill="url(#orangeGlow)"/>
  </g>

  <g transform="translate(190 48)">
    <text x="0" y="56" class="wordmark" font-size="64" fill="#0a66b2">Context</text>
    <text x="285" y="56" class="wordmark" font-size="64" fill="#19b7b0">Works</text>
    <rect x="2" y="74" width="470" height="4" rx="2" fill="#e2e8f0"/>
    <text x="102" y="116" class="tagline" font-size="22" fill="#5f6b7a">AI Clinical OS</text>
  </g>
</svg>
