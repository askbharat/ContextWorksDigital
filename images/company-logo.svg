<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- "CW" in stylized square -->
  <g id="logo-mark">
    <rect x="8" y="12" width="36" height="36" rx="4" fill="#0066B8"/>
    <text x="26" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">CW</text>
  </g>
  
  <!-- Company Name -->
  <g id="company-text">
    <text x="54" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#0066B8">
      ContextWorks
    </text>
    <text x="54" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E5E5E">
      Digital
    </text>
  </g>
</svg>
