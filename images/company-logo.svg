<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Stylized "CW" monogram -->
  <g id="brand-mark">
    <rect x="8" y="12" width="36" height="36" rx="4" fill="#0078D4" opacity="0.1"/>
    <text x="26" y="40" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="24" font-weight="700" fill="#0078D4" text-anchor="middle">CW</text>
  </g>
  
  <!-- Company Name -->
  <g id="wordmark">
    <text x="56" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a" letter-spacing="0.5">ContextWorks</text>
    <text x="56" y="45" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13" font-weight="400" fill="#5e5e5e" letter-spacing="0.5">Digital</text>
  </g>
</svg>
