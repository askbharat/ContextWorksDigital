<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Bar chart bars -->
  <rect x="14" y="36" width="8" height="16" rx="2" fill="url(#chartGradient)"/>
  <rect x="26" y="26" width="8" height="26" rx="2" fill="url(#chartGradient)"/>
  <rect x="38" y="20" width="8" height="32" rx="2" fill="url(#chartGradient)"/>
  
  <!-- Trend line -->
  <path d="M 12 42 L 22 32 L 34 28 L 48 18" 
        stroke="#50a0d8" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Data points on trend line -->
  <circle cx="12" cy="42" r="2.5" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <circle cx="22" cy="32" r="2.5" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <circle cx="34" cy="28" r="2.5" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <circle cx="48" cy="18" r="2.5" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
</svg>
